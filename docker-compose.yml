services:
  postgres:
    image: postgres:16-alpine
    container_name: teraruim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teraruim
      POSTGRES_PASSWORD: teraruim
      POSTGRES_DB: teraruim
    ports:
      - "5432:5432"
    volumes:
      - teraruim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teraruim -d teraruim"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  teraruim_pgdata:
