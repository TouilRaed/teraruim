name: Mobile APK Build

on:
  push:
    tags:
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        id: build
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait --json > build.json
          cat build.json
          URL=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json')).at(-1)?.artifacts?.buildUrl || '')")
          BUILD_ID=$(node -e "console.log(JSON.parse(require('fs').readFileSync('build.json')).at(-1)?.id || '')")
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"

      - name: Comment build URL on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const id = "${{ steps.build.outputs.build_id }}";
            const url = `https://expo.dev/accounts/${{ secrets.EXPO_OWNER }}/projects/teraruim-admin/builds/${id}`;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `📱 APK build started: ${url}`,
            });
